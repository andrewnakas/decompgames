<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Swarm — private, silent browser probe</title>
<style>
  body { margin: 0; background: #08111b; color: #e2ecf5; font: 16px system-ui; text-align: center }
  main { max-width: 700px; margin: 1rem auto; padding: 0 1rem }
  canvas { display: block; width: min(90vw,448px); height: auto; margin: 1rem auto; image-rendering: pixelated; background: #000 }
  button { margin: .25rem; padding: .6rem 1rem; cursor: pointer }
  #status { min-height: 1.5em }
</style>
<main>
  <h1>Open Swarm</h1>
  <p>Private, incomplete replacement-data browser probe. Audio is permanently disabled.</p>
  <p id="status">Loading independent data…</p>
  <canvas id="screen" width="224" height="256" aria-label="Game display"></canvas>
  <div><button data-key="coin">Coin (5)</button><button data-key="start">Start (1)</button><button data-key="left">◀ Left</button><button data-key="fire">Fire</button><button data-key="right">Right ▶</button></div>
  <p>Move with ←/→ or A/D; Space fires. No saved progress in this probe.</p>
</main>
<script type="module">
import { SLOTS, snapshotFrame } from './frame-ring.js';

const expected = '37f4a73c9558a6a45301bd9d7f980997c5afd28f91d5033c3a88205c9175d019';
const status = document.getElementById('status');
const width = 256, height = 224, frameBytes = width * height * 3;
const ctrl = new Int32Array(new SharedArrayBuffer(16 * 4));
const fb = new Uint8Array(new SharedArrayBuffer(SLOTS * frameBytes));
const snap = new Uint8Array(frameBytes);
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const image = ctx.createImageData(height, width);
const bit = { coin: 1, start: 4, fire: 16, left: 32, right: 64 };
const key = { Digit5: 'coin', KeyC: 'coin', Digit1: 'start', Space: 'fire', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
const held = new Set();
let counter = 0, worker;
window.__openSwarm = { ready: false, frames: 0, error: '', dataSha256: '', audioEnabled: false, probes: [], frameHeaderPixels: 0 };

function setInput(name, down) {
  if (down) held.add(name); else held.delete(name);
  let value = 0;
  for (const item of held) value |= bit[item];
  Atomics.store(ctrl, 1, value);
}
window.__openSwarm.setInput = setInput;
function pulse(name) { setInput(name, true); setTimeout(() => setInput(name, false), 130); }
addEventListener('keydown', e => {
  const action = key[e.code];
  if (!action) return;
  e.preventDefault();
  if (!e.repeat) setInput(action, true);
});
addEventListener('keyup', e => {
  const action = key[e.code];
  if (action) { e.preventDefault(); setInput(action, false); }
});
for (const button of document.querySelectorAll('button[data-key]')) {
  const action = button.dataset.key;
  if (action === 'coin' || action === 'start') button.addEventListener('click', () => pulse(action));
  else {
    button.addEventListener('pointerdown', e => { e.preventDefault(); setInput(action, true); button.setPointerCapture(e.pointerId); });
    for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) button.addEventListener(event, () => setInput(action, false));
  }
}
function draw() {
  const next = Atomics.load(ctrl, 4);
  if (next !== counter && snapshotFrame(fb, snap, frameBytes, next, () => Atomics.load(ctrl, 4))) {
    // The translated Invaders video is ROT270: display width 224, height 256.
    for (let y = 0; y < width; y++) for (let x = 0; x < height; x++) {
      const source = (x * width + (width - 1 - y)) * 3;
      const dest = (y * height + x) * 4;
      image.data[dest] = snap[source];
      image.data[dest + 1] = snap[source + 1];
      image.data[dest + 2] = snap[source + 2];
      image.data[dest + 3] = 255;
    }
    ctx.putImageData(image, 0, 0);
    let headerPixels = 0;
    for (let gy = 0; gy < 224; gy++) for (let gx = 240; gx < 248; gx++) {
      if (snap[(gy * width + gx) * 3]) headerPixels++;
    }
    window.__openSwarm.frameHeaderPixels = headerPixels;
    counter = next;
    window.__openSwarm.frames = next;
  }
  requestAnimationFrame(draw);
}
try {
  if (!crossOriginIsolated) throw Error('Cross-origin isolation is required');
  const response = await fetch('./open-swarm-data.bin', { cache: 'no-store' });
  if (!response.ok) throw Error(`Replacement data HTTP ${response.status}`);
  const data = await response.arrayBuffer();
  if (data.byteLength !== 8192) throw Error(`Unexpected data length ${data.byteLength}`);
  const sha = [...new Uint8Array(await crypto.subtle.digest('SHA-256', data))].map(b => b.toString(16).padStart(2, '0')).join('');
  if (sha !== expected) throw Error(`Replacement data checksum mismatch: ${sha}`);
  window.__openSwarm.dataSha256 = sha;
  Atomics.store(ctrl, 5, 1);
  worker = new Worker('./worker.js', { type: 'module' });
  worker.onmessage = ({ data: message }) => {
    if (message.type === 'ready') { window.__openSwarm.ready = true; status.textContent = 'Experimental engine running'; }
    if (message.type === 'error') { window.__openSwarm.error = message.reason; status.textContent = `Engine error: ${message.reason}`; }
    if (message.type === 'restart') status.textContent = `Engine restarted: ${message.reason}`;
    if (message.type === 'probe') window.__openSwarm.probes.push(message);
  };
  worker.onerror = event => { window.__openSwarm.error = event.message; status.textContent = `Worker error: ${event.message}`; };
  worker.postMessage({ type: 'init', ctrl: ctrl.buffer, fb: fb.buffer, game: 'invaders', images: { maincpu: data } }, [data]);
  requestAnimationFrame(draw);
} catch (error) {
  window.__openSwarm.error = String(error);
  status.textContent = String(error);
}
addEventListener('pagehide', () => {
  Atomics.store(ctrl, 5, 0);
  if (worker) worker.terminate();
});
</script>
