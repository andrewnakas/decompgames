name: Private Open Junction feasibility build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate independent assets
        run: |
          python3 scripts/generate-open-junction-assets.py /tmp/open-junction-assets >/dev/null
          python3 scripts/generate-open-junction-glyphs.py /tmp/open-junction-glyphs
          python3 scripts/generate-open-junction-scenario.py /tmp/open-junction-scenario
      - name: Fetch pinned engine and toolchain
        run: |
          git clone --quiet https://github.com/konovalov-aleks/reSL.git /tmp/resl
          git -C /tmp/resl checkout --quiet 470cca330ee9abcf6173c843f4c89686c0c7e525
          git clone --quiet --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 6.0.1
          /tmp/emsdk/emsdk activate 6.0.1
      - name: Compile private candidate without audio
        run: |
          source /tmp/emsdk/emsdk_env.sh
          OPEN_JUNCTION_TRACE=1 python3 scripts/build-resl-browser.py \
            /tmp/resl /tmp/open-junction-build \
            /tmp/open-junction-assets /tmp/open-junction-glyphs \
            /tmp/open-junction-scenario \
            >/tmp/open-junction-build.log 2>&1 || {
              tail -n 100 /tmp/open-junction-build.log
              exit 1
            }
          python3 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('/tmp/open-junction-build/build-record.json').read_text())
          assert record['sourceRevision'] == '470cca330ee9abcf6173c843f4c89686c0c7e525'
          assert record['originalExternalResourcesBundled'] is False
          assert record['audioBackend'] == 'null'
          assert len(record['replacementGlyphs']) == 11
          assert record['replacementCursor']['name'] == 'cursor.json'
          assert len(record['replacementScenario']) == 6
          assert record['replacementEntranceSchedule'] == [0, 23, 8, 31, 16, 39]
          assert record['replacementStarterRoute'] == [
              {'x': 3, 'y': 1, 'type': 5},
              {'x': 2, 'y': 2, 'type': 3},
              {'x': 1, 'y': 3, 'type': 5},
          ]
          assert record['replacementForest'] == {'maximumTrees': 32, 'minimumSpacingPixels': 36}
          assert len(record['replacementPaletteRGB']) == 16
          assert record['unreplacedEmbeddedVisuals'] == []
          assert len(record['retainedEngineGeometryTables']) == 4
          assert record['browserTested'] is False
          assert record['releaseReady'] is False
          assert record['privateTraceEnabled'] is True
          assert record['shortBrowserLoadingScreen'] is True
          print('Private compile passed; release gate remains closed.')
          for item in record['files'][:2]:
              print(item['path'], item['bytes'], item['sha256'])
          PY
      - name: Check private corresponding-source package
        run: |
          python3 scripts/package-open-junction-private-source.py /tmp/open-junction-build
          tar -tzf /tmp/open-junction-build/open-junction-private-source.tar.gz \
            | grep -qx 'open-junction/engine/src/graphics/text.cpp'
          tar -tzf /tmp/open-junction-build/open-junction-private-source.tar.gz \
            | grep -qx 'open-junction/engine/resources/open-junction/play.7'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Start privately in muted Chromium
        env:
          OPEN_JUNCTION_SCREENSHOT: /tmp/open-junction-gameplay.png
          OPEN_JUNCTION_TRAIN_SCREENSHOT: /tmp/open-junction-train.png
          OPEN_JUNCTION_THIRD_SCREENSHOT: /tmp/open-junction-third-station.png
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps
          timeout 360s node scripts/test-open-junction-private.mjs /tmp/open-junction-build/build
      - name: Exercise the actual player in an ephemeral private preview
        env:
          OPEN_JUNCTION_PLAYER_SCREENSHOT: /tmp/open-junction-player.png
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          runtime = Path('public/runtime/shortline/private')
          runtime.mkdir(parents=True)
          for name in ('resl.js', 'resl.wasm'):
              shutil.copyfile(Path('/tmp/open-junction-build/build') / name, runtime / name)
          manifest = {
              'id': 'shortline', 'engine': 'resl',
              'base': '/runtime/shortline/private/', 'script': 'resl.js',
              'saveVersion': 'open-junction-private-1',
              'saveRoots': ['/persistent'], 'mountSave': True,
              'assets': [], 'args': ['--windowed'], 'audioBackend': 'null',
          }
          Path('public/manifests/shortline.json').write_text(json.dumps(manifest))
          catalog = Path('src/data/games.json')
          games = json.loads(catalog.read_text())
          candidate = next(game for game in games if game['id'] == 'shortline')
          assert candidate['mode'] == 'project'
          candidate['mode'] = 'instant'
          candidate['title'] = 'Open Junction (private candidate)'
          candidate['runtime'] = 'shortline'
          candidate['downloadMB'] = 1.8
          catalog.write_text(json.dumps(games))
          PY
          pnpm build
          timeout 150s node scripts/test-open-junction-player-private.mjs
      - name: Retain replacement-only screenshot for visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-junction-private-screenshot
          path: /tmp/open-junction-*.png
          if-no-files-found: ignore
          retention-days: 1
